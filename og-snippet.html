<!--
  ServiceFlow link-preview tags. Copy into <head> of a new contractor preview.
  Replace SLUG, TITLE (use the same text as <title>, keep HTML entities),
  and DESCRIPTION (one plain line, e.g. "A homepage preview built for NAME in CITY, ST.").
-->
<meta property="og:title" content="TITLE">
<meta property="og:description" content="DESCRIPTION">
<meta property="og:image" content="https://previews.myserviceflowapp.com/SLUG/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://previews.myserviceflowapp.com/SLUG/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ServiceFlow">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="TITLE">
<meta name="twitter:description" content="DESCRIPTION">
<meta name="twitter:image" content="https://previews.myserviceflowapp.com/SLUG/og.jpg">
